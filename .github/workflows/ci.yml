name: CI

on:
  push:
    branches-ignore: [ci-badges]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests unitarios
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q --junitxml=reports/tests.xml --cov=backend --cov-report=xml:reports/coverage.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tests de disponibilidad del frontend
        run: node --experimental-test-coverage --test --test-reporter=lcov --test-reporter-destination=reports/lcov.info tests/test_frontend.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: reports/
          if-no-files-found: warn

  sonarcloud:
    name: Analisis de codigo (SonarCloud)
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SONAR_TOKEN_SET: ${{ secrets.SONAR_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v5
        if: env.SONAR_TOKEN_SET == 'true'
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        if: env.SONAR_TOKEN_SET == 'true'
        with:
          name: test-results
          path: reports
      - uses: SonarSource/sonarqube-scan-action@v4
        if: env.SONAR_TOKEN_SET == 'true'
        with:
          args: >-
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
      - name: Aviso si falta configurar SONAR_TOKEN
        if: env.SONAR_TOKEN_SET != 'true'
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "::error::Falta SONAR_TOKEN; main requiere aprobar el Quality Gate antes de publicar y desplegar."
            exit 1
          fi
          echo "::warning::SONAR_TOKEN no está configurado; se omite el análisis de SonarCloud."

  sast:
    name: SAST Python (Bandit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install bandit==1.8.6
      - name: Analizar backend
        run: |
          mkdir -p reports
          python -m bandit -r backend -f json -o reports/bandit.json --exit-zero
      - name: Valorar resultados y bloquear severidad media o alta
        if: always()
        run: python scripts/sast_rating.py reports/bandit.json reports/sast.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sast-results
          path: reports/
          if-no-files-found: error

  publish-rating:
    name: Publicar badge SAST
    needs: sast
    if: >-
      always() && !cancelled() && github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/actions' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: publish-ci-badges
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sast-results
          path: reports
      - name: Actualizar datos del badge en rama ci-badges
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const badge = JSON.parse(fs.readFileSync('reports/sast.json', 'utf8'));
            const { owner, repo } = context.repo;
            const branch = 'ci-badges';
            const source = context.ref.replace('refs/heads/', '');
            let parent;
            let baseTree;
            try {
              const ref = await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` });
              parent = ref.data.object.sha;
              const commit = await github.rest.git.getCommit({ owner, repo, commit_sha: parent });
              baseTree = commit.data.tree.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const tree = await github.rest.git.createTree({
              owner, repo,
              ...(baseTree ? { base_tree: baseTree } : {}),
              tree: [{ path: `${source}.json`, mode: '100644', type: 'blob',
                content: JSON.stringify({ ...badge, commit: context.sha, run: context.runId }) + '\n' }]
            });
            const commit = await github.rest.git.createCommit({
              owner, repo, message: `SAST ${source}: ${context.sha}`,
              tree: tree.data.sha, parents: parent ? [parent] : []
            });
            if (parent) {
              await github.rest.git.updateRef({ owner, repo, ref: `heads/${branch}`, sha: commit.data.sha });
            } else {
              await github.rest.git.createRef({ owner, repo, ref: `refs/heads/${branch}`, sha: commit.data.sha });
            }

  publish-docker:
    name: Publicar imágenes en Docker Hub y Deploy
    needs: [tests, sast, sonarcloud]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout código
        uses: actions/checkout@v5

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en Docker Hub
        if: "${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}"
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build y Push Imagen Backend a Docker Hub
        if: "${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}"
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/superlist-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/superlist-backend:${{ github.sha }}

      - name: Build y Push Imagen Frontend a Docker Hub
        if: "${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}"
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/superlist-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/superlist-frontend:${{ github.sha }}

      - name: Disparar Deploy Hook de Render (Backend)
        if: "${{ env.RENDER_DEPLOY_HOOK_BACKEND != '' }}"
        env:
          RENDER_DEPLOY_HOOK_BACKEND: ${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}
        run: |
          echo "Disparando despliegue de Backend en Render..."
          curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}"

      - name: Disparar Deploy Hook de Render (Frontend)
        if: "${{ env.RENDER_DEPLOY_HOOK_FRONTEND != '' }}"
        env:
          RENDER_DEPLOY_HOOK_FRONTEND: ${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}
        run: |
          echo "Disparando despliegue de Frontend en Render..."
          curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}"

  notify-discord:
    name: Notificar resultado en Discord
    needs: [tests, sast, sonarcloud, publish-rating]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Enviar resumen del CI
        uses: actions/github-script@v7
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CI_RESULTS: ${{ toJSON(needs) }}
          SONAR_CONFIGURED: ${{ secrets.SONAR_TOKEN != '' }}
        with:
          script: |
            const webhook = process.env.DISCORD_WEBHOOK_URL;
            if (!webhook) {
              core.warning('Falta DISCORD_WEBHOOK_URL; se omite la notificación a Discord.');
              return;
            }
            const jobs = JSON.parse(process.env.CI_RESULTS);
            const failed = Object.values(jobs).some(job => job.result === 'failure');
            const incomplete = ['tests', 'sast', 'sonarcloud'].some(name => jobs[name].result !== 'success')
              || Object.values(jobs).some(job => job.result === 'cancelled');
            const title = failed ? 'CI FALLÓ' : incomplete ? 'CI INCOMPLETO' : 'CI OK';
            const labels = { success: 'OK', failure: 'FALLÓ', skipped: 'Omitido', cancelled: 'Cancelado' };
            const names = { tests: 'Tests', sast: 'SAST (Bandit)', sonarcloud: 'SonarCloud', 'publish-rating': 'Badge SAST' };
            const details = Object.entries(jobs).map(([name, job]) => {
              const result = name === 'sonarcloud' && process.env.SONAR_CONFIGURED !== 'true'
                ? `${labels[job.result] || job.result}: falta SONAR_TOKEN` : labels[job.result] || job.result;
              return `${names[name]}: ${result}`;
            }).join('\n');
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const payload = {
              allowed_mentions: { parse: [] },
              embeds: [{
                title,
                url: runUrl,
                color: failed ? 15158332 : incomplete ? 15844367 : 3066993,
                description: details,
                fields: [
                  { name: 'Repositorio', value: process.env.GITHUB_REPOSITORY },
                  { name: 'Rama / referencia', value: process.env.GITHUB_HEAD_REF || process.env.GITHUB_REF_NAME },
                  { name: 'Commit', value: process.env.GITHUB_SHA.slice(0, 7) }
                ]
              }]
            };
            try {
              const url = new URL(webhook);
              url.searchParams.set('wait', 'true');
              const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload),
                signal: AbortSignal.timeout(15000)
              });
              if (!response.ok) {
                core.warning(`Discord rechazó la notificación (HTTP ${response.status}).`);
              }
            } catch {
              core.warning('No se pudo enviar la notificación a Discord. Revisar el webhook y la conectividad.');
            }
