name: CI

on:
  push:
    branches-ignore: [ci-badges]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests unitarios
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q --junitxml=reports/tests.xml --cov=backend --cov-report=xml:reports/coverage.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: reports/
          if-no-files-found: warn

  sonarcloud:
    name: Analisis de codigo (SonarCloud)
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: always() && !cancelled()
    env:
      SONAR_TOKEN_SET: ${{ secrets.SONAR_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v5
        if: env.SONAR_TOKEN_SET == 'true'
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        if: env.SONAR_TOKEN_SET == 'true'
        with:
          name: test-results
          path: reports
      - uses: SonarSource/sonarqube-scan-action@v4
        if: env.SONAR_TOKEN_SET == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
      - name: Aviso si falta configurar SONAR_TOKEN
        if: env.SONAR_TOKEN_SET != 'true'
        run: echo "::warning::SONAR_TOKEN no está configurado como secret del repo; se omite el análisis de SonarCloud. Ver README para configurarlo."

  sast:
    name: SAST Python (Bandit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install bandit==1.8.6
      - name: Analizar backend
        run: |
          mkdir -p reports
          python -m bandit -r backend -f json -o reports/bandit.json --exit-zero
      - name: Valorar resultados y bloquear severidad media o alta
        if: always()
        run: python scripts/sast_rating.py reports/bandit.json reports/sast.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sast-results
          path: reports/
          if-no-files-found: error

  publish-rating:
    name: Publicar badge SAST
    needs: sast
    if: >-
      always() && !cancelled() && github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/actions' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: publish-ci-badges
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sast-results
          path: reports
      - name: Actualizar datos del badge en rama ci-badges
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const badge = JSON.parse(fs.readFileSync('reports/sast.json', 'utf8'));
            const { owner, repo } = context.repo;
            const branch = 'ci-badges';
            const source = context.ref.replace('refs/heads/', '');
            let parent;
            let baseTree;
            try {
              const ref = await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` });
              parent = ref.data.object.sha;
              const commit = await github.rest.git.getCommit({ owner, repo, commit_sha: parent });
              baseTree = commit.data.tree.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const tree = await github.rest.git.createTree({
              owner, repo,
              ...(baseTree ? { base_tree: baseTree } : {}),
              tree: [{ path: `${source}.json`, mode: '100644', type: 'blob',
                content: JSON.stringify({ ...badge, commit: context.sha, run: context.runId }) + '\n' }]
            });
            const commit = await github.rest.git.createCommit({
              owner, repo, message: `SAST ${source}: ${context.sha}`,
              tree: tree.data.sha, parents: parent ? [parent] : []
            });
            if (parent) {
              await github.rest.git.updateRef({ owner, repo, ref: `heads/${branch}`, sha: commit.data.sha });
            } else {
              await github.rest.git.createRef({ owner, repo, ref: `refs/heads/${branch}`, sha: commit.data.sha });
            }
