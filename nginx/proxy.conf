# Docker DNS: re-resolve names when a container is recreated.
resolver 127.0.0.11 valid=5s ipv6=off;

upstream web_nodes {
    zone web_nodes 64k;
    server frontend:80 resolve max_fails=1 fail_timeout=5s;
    server frontend2:80 resolve max_fails=1 fail_timeout=5s;
    server frontend3:80 resolve max_fails=1 fail_timeout=5s;
}

upstream api_nodes {
    zone api_nodes 64k;
    server backend:8000 resolve max_fails=1 fail_timeout=5s;
    server backend2:8000 resolve max_fails=1 fail_timeout=5s;
    server backend3:8000 resolve max_fails=1 fail_timeout=5s;
}

server {
    listen 80;
    server_name _;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 1s;
    proxy_read_timeout 10s;
    proxy_send_timeout 10s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 3;

    # Lists attempted upstream addresses, useful for demonstrating failover.
    add_header X-Upstream-Addr $upstream_addr always;

    location / {
        proxy_pass http://web_nodes;
    }

    location /api/ {
        proxy_pass http://api_nodes;
    }

    location = /docs {
        proxy_pass http://api_nodes;
    }

    location = /openapi.json {
        proxy_pass http://api_nodes;
    }
}
